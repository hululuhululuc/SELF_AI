name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,ui]"

      - name: Run minimal CI tests
        run: |
          python -m pytest -q \
            tests/test_engine_loop_goal_contract.py \
            tests/test_frontend_app.py \
            tests/test_frontend_formatting.py \
            tests/test_frontend_smoke.py \
            tests/test_main.py
